name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gates:
    name: Gates projet (tests, lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installation des dépendances (npm ci)
        run: npm ci

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Lint (ESLint)
        run: npm run lint

      - name: Vérification des types (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build de production (next build)
        run: npm run build
